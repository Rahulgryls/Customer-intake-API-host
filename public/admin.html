<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Intake API — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/json-lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
<style>
  :root { --bg:#0f1420; --panel:#161d2e; --border:#2a3348; --text:#e6e9f0; --muted:#8b93a7; --accent:#5b8def; --danger:#e5484d; --ok:#2fb573; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  .container { display:flex; height:calc(100vh - 60px); }
  .sidebar { width:300px; border-right:1px solid var(--border); display:flex; flex-direction:column; }
  .sidebar-toolbar { padding:10px; border-bottom:1px solid var(--border); display:flex; gap:6px; }
  .sidebar-toolbar input[type=text] { flex:1; min-width:0; }
  .tree { flex:1; overflow-y:auto; padding:8px 4px; font-size:13px; }
  .tree-root { padding:6px 8px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; }
  .folder { user-select:none; }
  .folder-row { display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:6px; cursor:pointer; }
  .folder-row:hover { background:#1c2436; }
  .folder-row .caret { display:inline-block; transition:transform .12s; color:var(--muted); font-size:11px; width:10px; }
  .folder-row.collapsed .caret { transform:rotate(-90deg); }
  .folder-row .icon { opacity:0.85; }
  .folder-row .name { font-weight:600; }
  .folder-row .count { color:var(--muted); font-size:11px; margin-left:auto; }
  .folder-children { padding-left:20px; }
  .folder-children.collapsed { display:none; }
  .file-item { display:flex; flex-direction:column; padding:7px 8px 7px 4px; border-radius:6px; cursor:pointer; margin-bottom:1px; }
  .file-item .row { display:flex; align-items:center; gap:6px; }
  .file-item .name { color:var(--text); font-family: ui-monospace, monospace; font-size:12.5px; }
  .file-item .meta { color:var(--muted); font-size:10.5px; margin-top:2px; margin-left:18px; }
  .file-item:hover { background:#1c2436; }
  .file-item.active { background:var(--accent); }
  .file-item.active .meta { color:#dbe6ff; }
  .empty { color:#555; font-size:12px; padding:10px 12px; }
  .main { flex:1; display:flex; flex-direction:column; padding:14px 18px; min-width:0; }
  .toolbar { display:flex; gap:8px; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
  input[type=text], select { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-size:13px; }
  button.btn { background:var(--accent); color:white; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  button.btn.secondary { background:var(--panel); border:1px solid var(--border); color:var(--text); }
  button.btn.danger { background:var(--danger); }
  button.btn:disabled { opacity:0.4; cursor:not-allowed; }
  .editor-wrap { flex:1; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .CodeMirror { height:100% !important; font-size:12.5px; }
  .status { font-size:12px; margin-top:8px; min-height:16px; }
  .status.ok { color:var(--ok); }
  .status.err { color:var(--danger); }
  .filename-tag { font-family: ui-monospace, monospace; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Customer Intake API — Admin Portal</h1>
    <div class="sub">Browse the folder tree, open a file, edit its JSON, upload or delete it</div>
  </div>
  <div class="sub" id="counts"></div>
</header>
<div class="container">
  <div class="sidebar">
    <div class="tree-root">customer-intake-api</div>
    <div class="sidebar-toolbar">
      <input type="text" id="search" placeholder="Search files...">
    </div>
    <div class="tree" id="tree"></div>
  </div>
  <div class="main">
    <div class="toolbar">
      <span class="filename-tag" id="currentFile">No file selected</span>
      <span style="flex:1"></span>
      <select id="targetFolder"></select>
      <input type="text" id="newIdInput" placeholder="new file ID (e.g. 110099999)" style="width:190px">
      <button class="btn secondary" id="newBtn">New File</button>
      <button class="btn secondary" id="uploadBtn" title="Upload a .json file into the selected folder">Upload</button>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
      <button class="btn secondary" id="downloadBtn" disabled>Download</button>
      <button class="btn" id="saveBtn" disabled>Save</button>
      <button class="btn danger" id="deleteBtn" disabled>Delete</button>
    </div>
    <div class="editor-wrap"><textarea id="editor"></textarea></div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
// Folder labels shown in the tree/dropdown, keyed by the real category id used in API calls.
const FOLDER_LABEL = { customers: "customers", "risk-profiles": "risk-profiles", transactions: "transactions" };
const CATEGORIES = Object.keys(FOLDER_LABEL);

let currentCategory = null;
let currentId = null;
let filesByCategory = {};              // category -> [file, ...]
let collapsed = {};                    // category -> bool

const $ = s => document.querySelector(s);
const treeEl = $("#tree"), statusEl = $("#status"), countsEl = $("#counts"), currentFileEl = $("#currentFile");
const saveBtn = $("#saveBtn"), deleteBtn = $("#deleteBtn"), downloadBtn = $("#downloadBtn"), targetFolderEl = $("#targetFolder");

const cm = CodeMirror.fromTextArea(document.getElementById("editor"), {
  mode: "application/json", theme: "material-darker", lineNumbers: true,
  gutters: ["CodeMirror-lint-markers"], lint: true, tabSize: 2
});

CATEGORIES.forEach(cat => {
  const opt = document.createElement("option");
  opt.value = cat; opt.textContent = FOLDER_LABEL[cat];
  targetFolderEl.appendChild(opt);
});

function setStatus(msg, ok) { statusEl.textContent = msg; statusEl.className = "status " + (ok === true ? "ok" : ok === false ? "err" : ""); }
function fmtBytes(n) { return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB"; }
function fmtDate(iso) { return new Date(iso).toLocaleString(); }

async function refreshList() {
  const res = await fetch("/admin/api/files");
  if (!res.ok) { setStatus("Failed to list files (" + res.status + ")", false); return; }
  const data = await res.json();
  filesByCategory = {};
  CATEGORIES.forEach(c => filesByCategory[c] = []);
  data.files.forEach(f => { if (filesByCategory[f.category]) filesByCategory[f.category].push(f); });
  CATEGORIES.forEach(c => filesByCategory[c].sort((a, b) => a.id.localeCompare(b.id)));
  countsEl.textContent = CATEGORIES.map(c => `${FOLDER_LABEL[c]}: ${filesByCategory[c].length}`).join(" · ");
  renderTree();
}

function renderTree() {
  const q = $("#search").value.trim().toLowerCase();
  treeEl.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const items = filesByCategory[cat].filter(f => f.id.toLowerCase().includes(q));
    const isCollapsed = !!collapsed[cat] && q === "";  // auto-expand while searching

    const folderDiv = document.createElement("div");
    folderDiv.className = "folder";

    const row = document.createElement("div");
    row.className = "folder-row" + (isCollapsed ? " collapsed" : "");
    row.innerHTML = `<span class="caret">▾</span><span class="icon">📁</span><span class="name">${FOLDER_LABEL[cat]}</span><span class="count">${items.length}</span>`;
    row.onclick = () => { collapsed[cat] = !collapsed[cat]; renderTree(); };
    folderDiv.appendChild(row);

    const childrenDiv = document.createElement("div");
    childrenDiv.className = "folder-children" + (isCollapsed ? " collapsed" : "");
    if (items.length === 0) {
      childrenDiv.innerHTML = '<div class="empty">No files</div>';
    } else {
      items.forEach(f => {
        const item = document.createElement("div");
        item.className = "file-item" + (cat === currentCategory && f.id === currentId ? " active" : "");
        item.innerHTML = `<div class="row"><span>📄</span><span class="name">${f.filename}</span></div><div class="meta">${fmtBytes(f.sizeBytes)} · ${fmtDate(f.updatedAt)}</div>`;
        item.onclick = (e) => { e.stopPropagation(); openFile(cat, f.id); };
        childrenDiv.appendChild(item);
      });
    }
    folderDiv.appendChild(childrenDiv);
    treeEl.appendChild(folderDiv);
  });
}

async function openFile(category, id) {
  const res = await fetch(`/admin/api/files/${category}/${encodeURIComponent(id)}`);
  if (!res.ok) return setStatus("Failed to open " + id, false);
  const text = await res.text();
  cm.setValue(text);
  currentCategory = category; currentId = id;
  targetFolderEl.value = category;
  currentFileEl.textContent = `${category}/${id}.json`;
  saveBtn.disabled = false; deleteBtn.disabled = false; downloadBtn.disabled = false;
  setStatus("Loaded " + id, null);
  renderTree();
}

$("#search").oninput = renderTree;

$("#newBtn").onclick = () => {
  const category = targetFolderEl.value;
  const id = $("#newIdInput").value.trim();
  if (!id) return setStatus("Enter a new file ID first", false);
  const template = category === "customers"
    ? { customerId: id, siebelId: "", partyType: "ORGANISATION", customerStatus: "ACTIVE", customerSince: "2024-01-01" }
    : category === "risk-profiles"
    ? { customerId: id, partyType: "ORGANISATION", creditRiskRating: {}, regulatoryClassification: {}, amlRiskProfile: {} }
    : { accounts: [], aggregates: {} };
  cm.setValue(JSON.stringify(template, null, 2));
  currentCategory = category; currentId = id;
  currentFileEl.textContent = `${category}/${id}.json (new, unsaved)`;
  saveBtn.disabled = false; deleteBtn.disabled = true; downloadBtn.disabled = true;
  setStatus(`New file template ready in "${category}" — edit then Save`, null);
};

$("#saveBtn").onclick = async () => {
  if (!currentCategory || !currentId) return;
  let parsed;
  try { parsed = JSON.parse(cm.getValue()); }
  catch (e) { return setStatus("Invalid JSON: " + e.message, false); }
  const res = await fetch(`/admin/api/files/${currentCategory}/${encodeURIComponent(currentId)}`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(parsed)
  });
  if (res.ok) { setStatus("Saved " + currentId, true); deleteBtn.disabled = false; downloadBtn.disabled = false; await refreshList(); }
  else setStatus("Save failed (" + res.status + ")", false);
};

$("#deleteBtn").onclick = async () => {
  if (!currentCategory || !currentId) return;
  if (!confirm(`Delete ${currentCategory}/${currentId}.json? This cannot be undone.`)) return;
  const res = await fetch(`/admin/api/files/${currentCategory}/${encodeURIComponent(currentId)}`, { method: "DELETE" });
  if (res.ok) {
    setStatus("Deleted " + currentId, true);
    currentCategory = null; currentId = null; cm.setValue(""); currentFileEl.textContent = "No file selected";
    saveBtn.disabled = true; deleteBtn.disabled = true; downloadBtn.disabled = true;
    await refreshList();
  } else setStatus("Delete failed (" + res.status + ")", false);
};

$("#downloadBtn").onclick = () => {
  if (!currentCategory || !currentId) return;
  window.open(`/admin/api/files/${currentCategory}/${encodeURIComponent(currentId)}?download=true`, "_blank");
};

$("#uploadBtn").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const category = targetFolderEl.value;
  const text = await file.text();
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (err) { setStatus("Uploaded file is not valid JSON: " + err.message, false); return; }
  const id = file.name.replace(/\.json$/i, "");
  cm.setValue(JSON.stringify(parsed, null, 2));
  currentCategory = category; currentId = id;
  currentFileEl.textContent = `${category}/${id}.json (uploaded, unsaved — click Save to confirm)`;
  saveBtn.disabled = false; downloadBtn.disabled = true;
  setStatus(`Loaded upload "${file.name}" into "${category}" as ID "${id}" — review and click Save to write it`, null);
  e.target.value = "";
};

refreshList();
</script>
</body>
</html>
