<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Intake API — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/json-lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
<style>
  :root { --bg:#0f1420; --panel:#161d2e; --border:#2a3348; --text:#e6e9f0; --muted:#8b93a7; --accent:#5b8def; --danger:#e5484d; --ok:#2fb573; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  .layout { display:flex; height:calc(100vh - 60px); }
  nav.tabs { display:flex; gap:4px; padding:10px 20px 0; border-bottom:1px solid var(--border); }
  nav.tabs button { background:none; border:none; color:var(--muted); padding:8px 14px; cursor:pointer; font-size:13px; border-radius:6px 6px 0 0; }
  nav.tabs button.active { color:var(--text); background:var(--panel); }
  .container { display:flex; flex:1; }
  .sidebar { width:280px; border-right:1px solid var(--border); display:flex; flex-direction:column; }
  .sidebar-toolbar { padding:10px; border-bottom:1px solid var(--border); display:flex; gap:6px; }
  .sidebar-toolbar input[type=text] { flex:1; min-width:0; }
  .filelist { flex:1; overflow-y:auto; padding:6px; }
  .file-item { padding:9px 10px; border-radius:6px; cursor:pointer; font-size:13px; margin-bottom:2px; }
  .file-item .name { color:var(--text); font-family: ui-monospace, monospace; }
  .file-item .meta { color:var(--muted); font-size:11px; margin-top:2px; }
  .file-item:hover { background:#1c2436; }
  .file-item.active { background:var(--accent); }
  .file-item.active .meta { color:#dbe6ff; }
  .empty { color:#555; font-size:12px; padding:14px; }
  .main { flex:1; display:flex; flex-direction:column; padding:14px 18px; min-width:0; }
  .toolbar { display:flex; gap:8px; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
  input[type=text] { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-size:13px; }
  button.btn { background:var(--accent); color:white; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  button.btn.secondary { background:var(--panel); border:1px solid var(--border); color:var(--text); }
  button.btn.danger { background:var(--danger); }
  button.btn:disabled { opacity:0.4; cursor:not-allowed; }
  .editor-wrap { flex:1; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .CodeMirror { height:100% !important; font-size:12.5px; }
  .status { font-size:12px; margin-top:8px; min-height:16px; }
  .status.ok { color:var(--ok); }
  .status.err { color:var(--danger); }
  .filename-tag { font-family: ui-monospace, monospace; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Customer Intake API — Admin Portal</h1>
    <div class="sub">Browse, upload, edit and delete the JSON files behind each API</div>
  </div>
  <div class="sub" id="counts"></div>
</header>
<nav class="tabs">
  <button data-cat="customers" class="active">Customers</button>
  <button data-cat="risk-profiles">Risk Profiles</button>
  <button data-cat="transactions">Transactions</button>
</nav>
<div class="container">
  <div class="sidebar">
    <div class="sidebar-toolbar">
      <input type="text" id="search" placeholder="Search files...">
      <button class="btn secondary" id="uploadBtn" title="Upload a .json file">Upload</button>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
    </div>
    <div class="filelist" id="filelist"></div>
  </div>
  <div class="main">
    <div class="toolbar">
      <span class="filename-tag" id="currentFile">No file selected</span>
      <span style="flex:1"></span>
      <input type="text" id="newIdInput" placeholder="new file ID (e.g. 110099999)">
      <button class="btn secondary" id="newBtn">New File</button>
      <button class="btn secondary" id="downloadBtn" disabled>Download</button>
      <button class="btn" id="saveBtn" disabled>Save</button>
      <button class="btn danger" id="deleteBtn" disabled>Delete</button>
    </div>
    <div class="editor-wrap"><textarea id="editor"></textarea></div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
let category = "customers";
let currentId = null;
let files = [];

const $ = s => document.querySelector(s);
const filelistEl = $("#filelist"), statusEl = $("#status"), countsEl = $("#counts"), currentFileEl = $("#currentFile");
const saveBtn = $("#saveBtn"), deleteBtn = $("#deleteBtn"), downloadBtn = $("#downloadBtn");

const cm = CodeMirror.fromTextArea(document.getElementById("editor"), {
  mode: "application/json", theme: "material-darker", lineNumbers: true,
  gutters: ["CodeMirror-lint-markers"], lint: true, tabSize: 2
});

function setStatus(msg, ok) { statusEl.textContent = msg; statusEl.className = "status " + (ok === true ? "ok" : ok === false ? "err" : ""); }
function fmtBytes(n) { return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB"; }
function fmtDate(iso) { return new Date(iso).toLocaleString(); }

async function refreshList() {
  const res = await fetch("/admin/api/files?category=" + category);
  if (!res.ok) { setStatus("Failed to list files (" + res.status + ")", false); return; }
  const data = await res.json();
  files = data.files;
  renderList();
  const totalRes = await fetch("/admin/api/files");
  const totalData = await totalRes.json();
  const byCat = {};
  totalData.files.forEach(f => byCat[f.category] = (byCat[f.category] || 0) + 1);
  countsEl.textContent = `Customers: ${byCat["customers"]||0} · Risk Profiles: ${byCat["risk-profiles"]||0} · Transactions: ${byCat["transactions"]||0}`;
}

function renderList() {
  const q = $("#search").value.trim().toLowerCase();
  const shown = files.filter(f => f.id.toLowerCase().includes(q));
  filelistEl.innerHTML = "";
  if (shown.length === 0) { filelistEl.innerHTML = '<div class="empty">No files</div>'; return; }
  shown.forEach(f => {
    const div = document.createElement("div");
    div.className = "file-item" + (f.id === currentId ? " active" : "");
    div.innerHTML = `<div class="name">${f.filename}</div><div class="meta">${fmtBytes(f.sizeBytes)} · ${fmtDate(f.updatedAt)}</div>`;
    div.onclick = () => openFile(f.id);
    filelistEl.appendChild(div);
  });
}

async function openFile(id) {
  const res = await fetch(`/admin/api/files/${category}/${encodeURIComponent(id)}`);
  if (!res.ok) return setStatus("Failed to open " + id, false);
  const text = await res.text();
  cm.setValue(text);
  currentId = id;
  currentFileEl.textContent = `${category}/${id}.json`;
  saveBtn.disabled = false; deleteBtn.disabled = false; downloadBtn.disabled = false;
  setStatus("Loaded " + id, null);
  renderList();
}

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    category = btn.dataset.cat;
    currentId = null;
    cm.setValue("");
    currentFileEl.textContent = "No file selected";
    saveBtn.disabled = true; deleteBtn.disabled = true; downloadBtn.disabled = true;
    setStatus("", null);
    refreshList();
  };
});

$("#search").oninput = renderList;

$("#newBtn").onclick = () => {
  const id = $("#newIdInput").value.trim();
  if (!id) return setStatus("Enter a new file ID first", false);
  const template = category === "customers"
    ? { customerId: id, siebelId: "", partyType: "ORGANISATION", customerStatus: "ACTIVE", customerSince: "2024-01-01" }
    : category === "risk-profiles"
    ? { customerId: id, partyType: "ORGANISATION", creditRiskRating: {}, regulatoryClassification: {}, amlRiskProfile: {} }
    : { accounts: [], aggregates: {} };
  cm.setValue(JSON.stringify(template, null, 2));
  currentId = id;
  currentFileEl.textContent = `${category}/${id}.json (new, unsaved)`;
  saveBtn.disabled = false; deleteBtn.disabled = true; downloadBtn.disabled = true;
  setStatus("New file template ready — edit then Save", null);
};

$("#saveBtn").onclick = async () => {
  if (!currentId) return;
  let parsed;
  try { parsed = JSON.parse(cm.getValue()); }
  catch (e) { return setStatus("Invalid JSON: " + e.message, false); }
  const res = await fetch(`/admin/api/files/${category}/${encodeURIComponent(currentId)}`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(parsed)
  });
  if (res.ok) { setStatus("Saved " + currentId, true); deleteBtn.disabled = false; downloadBtn.disabled = false; await refreshList(); }
  else setStatus("Save failed (" + res.status + ")", false);
};

$("#deleteBtn").onclick = async () => {
  if (!currentId) return;
  if (!confirm(`Delete ${category}/${currentId}.json? This cannot be undone.`)) return;
  const res = await fetch(`/admin/api/files/${category}/${encodeURIComponent(currentId)}`, { method: "DELETE" });
  if (res.ok) {
    setStatus("Deleted " + currentId, true);
    currentId = null; cm.setValue(""); currentFileEl.textContent = "No file selected";
    saveBtn.disabled = true; deleteBtn.disabled = true; downloadBtn.disabled = true;
    await refreshList();
  } else setStatus("Delete failed (" + res.status + ")", false);
};

$("#downloadBtn").onclick = () => {
  if (!currentId) return;
  window.open(`/admin/api/files/${category}/${encodeURIComponent(currentId)}?download=true`, "_blank");
};

$("#uploadBtn").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (err) { setStatus("Uploaded file is not valid JSON: " + err.message, false); return; }
  const id = file.name.replace(/\.json$/i, "");
  cm.setValue(JSON.stringify(parsed, null, 2));
  currentId = id;
  currentFileEl.textContent = `${category}/${id}.json (uploaded, unsaved — click Save to confirm)`;
  saveBtn.disabled = false; downloadBtn.disabled = true;
  setStatus(`Loaded upload "${file.name}" as ID "${id}" — review and click Save to write it`, null);
  e.target.value = "";
};

refreshList();
</script>
</body>
</html>
