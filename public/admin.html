<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Intake API — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1420; --panel:#161d2e; --border:#2a3348; --text:#e6e9f0; --muted:#8b93a7; --accent:#5b8def; --danger:#e5484d; --ok:#2fb573; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  .layout { display:flex; height:calc(100vh - 53px); }
  nav.tabs { display:flex; gap:4px; padding:10px 20px 0; border-bottom:1px solid var(--border); }
  nav.tabs button { background:none; border:none; color:var(--muted); padding:8px 14px; cursor:pointer; font-size:13px; border-radius:6px 6px 0 0; }
  nav.tabs button.active { color:var(--text); background:var(--panel); }
  .sidebar { width:230px; border-right:1px solid var(--border); overflow-y:auto; padding:10px; }
  .sidebar .item { padding:8px 10px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--muted); margin-bottom:2px; word-break:break-all; }
  .sidebar .item:hover { background:var(--panel); color:var(--text); }
  .sidebar .item.active { background:var(--accent); color:white; }
  .main { flex:1; display:flex; flex-direction:column; padding:16px 20px; overflow-y:auto; }
  .toolbar { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  input[type=text] { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-size:13px; }
  button.btn { background:var(--accent); color:white; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  button.btn.secondary { background:var(--panel); border:1px solid var(--border); color:var(--text); }
  button.btn.danger { background:var(--danger); }
  textarea { flex:1; width:100%; background:#0a0e17; color:#d7ffe0; border:1px solid var(--border); border-radius:8px; padding:14px; font-family:ui-monospace, monospace; font-size:12.5px; line-height:1.5; resize:none; min-height:300px; }
  .status { font-size:12px; margin-top:8px; min-height:16px; }
  .status.ok { color:var(--ok); }
  .status.err { color:var(--danger); }
  .container { display:flex; flex:1; gap:0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Customer Intake API — Admin Portal</h1>
    <div class="sub">View, add, edit and delete the mock records served by the API</div>
  </div>
  <div class="sub" id="counts"></div>
</header>
<nav class="tabs">
  <button data-tab="customers" class="active">Customers</button>
  <button data-tab="riskProfiles">Risk Profiles</button>
  <button data-tab="transactions">Transactions</button>
</nav>
<div class="container">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="toolbar">
      <input type="text" id="idInput" placeholder="customer ID (e.g. 110023456)">
      <button class="btn" id="loadBtn">Load / New</button>
      <button class="btn secondary" id="saveBtn">Save</button>
      <button class="btn danger" id="deleteBtn">Delete</button>
    </div>
    <textarea id="editor" placeholder="Select a record on the left, or type an ID above and click Load / New, then edit this JSON and Save."></textarea>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
let data = { customers: {}, riskProfiles: {}, transactions: {} };
let tab = "customers";
const endpointFor = { customers: "/admin/api/customers", riskProfiles: "/admin/api/risk-profiles", transactions: "/admin/api/transactions" };

const $ = (sel) => document.querySelector(sel);
const sidebar = $("#sidebar"), editor = $("#editor"), idInput = $("#idInput"), statusEl = $("#status"), countsEl = $("#counts");

function setStatus(msg, ok) {
  statusEl.textContent = msg;
  statusEl.className = "status " + (ok === true ? "ok" : ok === false ? "err" : "");
}

async function fetchAll() {
  const res = await fetch("/admin/api/data");
  if (!res.ok) { setStatus("Failed to load data (" + res.status + ")", false); return; }
  data = await res.json();
  renderSidebar();
  renderCounts();
}

function renderCounts() {
  countsEl.textContent = `Customers: ${Object.keys(data.customers).length} · Risk Profiles: ${Object.keys(data.riskProfiles).length} · Transactions: ${Object.keys(data.transactions).length}`;
}

function renderSidebar() {
  const ids = Object.keys(data[tab]).sort();
  sidebar.innerHTML = "";
  if (ids.length === 0) sidebar.innerHTML = '<div class="item" style="cursor:default;color:#555">No records yet</div>';
  ids.forEach(id => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = id;
    div.onclick = () => selectRecord(id);
    sidebar.appendChild(div);
  });
}

function selectRecord(id) {
  idInput.value = id;
  editor.value = JSON.stringify(data[tab][id], null, 2);
  setStatus("Loaded " + id, null);
  [...sidebar.children].forEach(c => c.classList.toggle("active", c.textContent === id));
}

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    tab = btn.dataset.tab;
    idInput.value = "";
    editor.value = "";
    renderSidebar();
    setStatus("", null);
  };
});

$("#loadBtn").onclick = () => {
  const id = idInput.value.trim();
  if (!id) return setStatus("Enter an ID first", false);
  if (data[tab][id]) { selectRecord(id); }
  else {
    editor.value = tab === "customers"
      ? JSON.stringify({ customerId: id, siebelId: "", partyType: "ORGANISATION", customerStatus: "ACTIVE", customerSince: "2024-01-01" }, null, 2)
      : tab === "riskProfiles"
      ? JSON.stringify({ customerId: id, partyType: "ORGANISATION", creditRiskRating: {}, regulatoryClassification: {}, amlRiskProfile: {} }, null, 2)
      : JSON.stringify({ accounts: [], aggregates: {} }, null, 2);
    setStatus("New record template for " + id + " — edit and Save", null);
  }
};

$("#saveBtn").onclick = async () => {
  const id = idInput.value.trim();
  if (!id) return setStatus("Enter an ID first", false);
  let parsed;
  try { parsed = JSON.parse(editor.value); }
  catch (e) { return setStatus("Invalid JSON: " + e.message, false); }
  const res = await fetch(endpointFor[tab] + "/" + encodeURIComponent(id), {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(parsed)
  });
  if (res.ok) { setStatus("Saved " + id, true); await fetchAll(); selectRecord(id); }
  else { setStatus("Save failed (" + res.status + ")", false); }
};

$("#deleteBtn").onclick = async () => {
  const id = idInput.value.trim();
  if (!id) return setStatus("Enter an ID first", false);
  if (!confirm("Delete " + id + " from " + tab + "?")) return;
  const res = await fetch(endpointFor[tab] + "/" + encodeURIComponent(id), { method: "DELETE" });
  if (res.ok) { setStatus("Deleted " + id, true); idInput.value = ""; editor.value = ""; await fetchAll(); }
  else { setStatus("Delete failed (" + res.status + ")", false); }
};

fetchAll();
</script>
</body>
</html>
